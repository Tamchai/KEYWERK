app:
  env: dev
  secret: replace-with-a-local-secret
  port: 8080
  cors:
    allow_origins: http://localhost:5173
  frontend_url: http://localhost:5173

stripe:
  enabled: false
  secret_key: sk_test_replace_me
  webhook_secret: whsec_replace_me

system:
  timezone: Asia/Bangkok

database:
  neon:
    host: your-neon-host
    user: your-neon-user
    password: your-neon-password
    name: your-neon-database
    port: 5432
    sslmode: require
    timezone: Asia/Bangkok
    channel_binding: require
    connect_timeout_seconds: 10
    statement_timeout_milliseconds: 10000
    max_open_connections: 10
    max_idle_connections: 5

seaweedfs:
  url: http://localhost:8333
  access_key: local-access-key
  secret_key: local-secret-key
  region: us-east-1
  bucket: products
  profile_bucket: profiles
  timeout_seconds: 30

dev_admin:
  enabled: true
  email: admin@gmail.com
  password: "1234"
